# @XRK_MENU@ → bash /xrk/body/tmux-menu.sh（setup 时替换）
bind ? run-shell '@XRK_MENU@ help || true'
bind -n MouseDown3Pane run-shell '@XRK_MENU@ pane || true'
bind \\ run-shell '@XRK_MENU@ pane || true'
bind -n F9 run-shell '@XRK_MENU@ pane || true'

bind -n MouseDown3StatusLeft display-menu -T '#[align=centre]向日葵 · 会话 · #{session_name}' -t = -x M -y W \
  '[会话]' '' '' \
  '  重命名' 'R' 'command-prompt -I "#S" "rename-session -- \"%%\""' \
  '  新建窗口' 'w' 'new-window -c "#{pane_current_path}"' \
  '  新建会话' 's' 'new-session' \
  '' '' '' \
  '[系统]' '' '' \
  '  帮助' 'h' 'run-shell @XRK_MENU@ help || true' \
  '  重载' 'r' 'source-file ~/.tmux.conf \; display "配置已重载"' \
  '  分离' 'd' 'detach-client'

bind -n MouseDown3Status display-menu -T '#[align=centre]向日葵 · 窗口 · #{window_index}:#{window_name}' -t = -x M -y W \
  '[窗口]' '' '' \
  '  重命名' 'R' 'command-prompt -I "#W" "rename-window -- \"%%\""' \
  '  关闭' 'q' 'kill-window' \
  '  新建' 'c' 'new-window -c "#{pane_current_path}"' \
  '' '' '' \
  '[切换]' '' '' \
  '  上一个' 'P' 'previous-window' \
  '  下一个' 'N' 'next-window' \
  '' '' '' \
  '[系统]' '' '' \
  '  帮助' 'h' 'run-shell @XRK_MENU@ help || true' \
  '  重载' 'r' 'source-file ~/.tmux.conf \; display "配置已重载"' \
  '  分离' 'd' 'detach-client'

bind -n MouseDown3StatusRight display-menu -T '#[align=centre]向日葵 · 系统' -t = -x M -y W \
  '[系统]' '' '' \
  '  帮助' 'h' 'run-shell @XRK_MENU@ help || true' \
  '  重载' 'r' 'source-file ~/.tmux.conf \; display "配置已重载"' \
  '  分离' 'd' 'detach-client'
