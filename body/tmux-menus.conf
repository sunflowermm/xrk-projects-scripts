# @XRK_MENU@ → bash /xrk/body/tmux-menu.sh（setup 时替换）
# 菜单项仅在 body/tmux-menu.sh 定义；此处只绑定触发方式
bind ? run-shell '@XRK_MENU@ help || true'
bind -n MouseDown3Pane run-shell '@XRK_MENU@ pane #{pane_id} #{mouse_x} #{mouse_y} || true'
bind \\ run-shell '@XRK_MENU@ pane #{pane_id} C P || true'
bind -n F9 run-shell '@XRK_MENU@ pane #{pane_id} C P || true'
bind -n MouseDown3StatusLeft run-shell '@XRK_MENU@ session #{mouse_x} W || true'
bind -n MouseDown3Status run-shell '@XRK_MENU@ window #{mouse_x} W || true'
bind -n MouseDown3StatusRight run-shell '@XRK_MENU@ system #{mouse_x} W || true'
