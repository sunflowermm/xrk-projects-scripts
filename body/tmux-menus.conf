# 鼠标菜单（必须在 bind 内联 display-menu，不可经 run-shell；@XRK_MENU@ 由 setup 替换）
bind ? run-shell '@XRK_MENU@ help'

bind -n MouseDown3Pane display-menu -T '#[align=centre]向日葵 · 窗格' -t = -x M -y M \
  '[编辑]' '' '' \
  '  复制模式' '[' 'copy-mode' \
  '  粘贴' 'p' 'paste-buffer' \
  '' '' '' \
  '[窗格]' '' '' \
  '  左右分割' 'v' 'split-window -h -c "#{pane_current_path}"' \
  '  上下分割' 's' 'split-window -v -c "#{pane_current_path}"' \
  '  最大化/还原' 'z' 'resize-pane -Z' \
  '  关闭窗格' 'w' 'kill-pane' \
  '' '' '' \
  '[窗口]' '' '' \
  '  新建窗口' 'c' 'new-window -c "#{pane_current_path}"' \
  '  重命名窗口' 'n' 'command-prompt -I "#W" "rename-window -- \"%%\""' \
  '  关闭窗口' 'q' 'kill-window' \
  '' '' '' \
  '[系统]' '' '' \
  '  快捷键帮助' 'h' 'run-shell @XRK_MENU@ help' \
  '  重载配置' 'r' 'source-file ~/.tmux.conf \\; display \"配置已重载\"' \
  '  分离会话' 'd' 'detach-client'

bind -n MouseDown3StatusLeft display-menu -T '#[align=centre]向日葵 · 会话 · #{session_name}' -t = -x M -y W \
  '[会话]' '' '' \
  '  重命名会话' 'R' 'command-prompt -I "#S" "rename-session -- \"%%\""' \
  '  新建窗口' 'w' 'new-window -c "#{pane_current_path}"' \
  '  新建会话' 's' 'new-session' \
  '  重排窗口编号' 'N' 'move-window -r' \
  '' '' '' \
  '[切换]' '' '' \
  '  上一个会话' 'p' 'switch-client -p' \
  '  下一个会话' 'n' 'switch-client -n' \
  '' '' '' \
  '[系统]' '' '' \
  '  快捷键帮助' 'h' 'run-shell @XRK_MENU@ help' \
  '  重载配置' 'r' 'source-file ~/.tmux.conf \; display "配置已重载"' \
  '  分离会话' 'd' 'detach-client'

bind -n M-MouseDown3StatusLeft display-menu -T '#[align=centre]向日葵 · 会话 · #{session_name}' -t = -x M -y W \
  '[会话]' '' '' \
  '  重命名会话' 'R' 'command-prompt -I "#S" "rename-session -- \"%%\""' \
  '  新建窗口' 'w' 'new-window -c "#{pane_current_path}"' \
  '  新建会话' 's' 'new-session' \
  '' '' '' \
  '[系统]' '' '' \
  '  快捷键帮助' 'h' 'run-shell @XRK_MENU@ help' \
  '  重载配置' 'r' 'source-file ~/.tmux.conf \; display "配置已重载"' \
  '  分离会话' 'd' 'detach-client'

bind -n MouseDown3Status display-menu -T '#[align=centre]向日葵 · 窗口 · #{window_index}:#{window_name}' -t = -x M -y W \
  '[窗口]' '' '' \
  '  重命名' 'R' 'command-prompt -I "#W" "rename-window -- \"%%\""' \
  '  关闭窗口' 'q' 'kill-window' \
  '  新建窗口' 'c' 'new-window -c "#{pane_current_path}"' \
  '' '' '' \
  '[切换]' '' '' \
  '  上一个窗口' 'P' 'previous-window' \
  '  下一个窗口' 'N' 'next-window' \
  '' '' '' \
  '[系统]' '' '' \
  '  快捷键帮助' 'h' 'run-shell @XRK_MENU@ help' \
  '  重载配置' 'r' 'source-file ~/.tmux.conf \; display "配置已重载"' \
  '  分离会话' 'd' 'detach-client'

bind -n MouseDown3StatusRight display-menu -T '#[align=centre]向日葵 · 系统' -t = -x M -y W \
  '[系统]' '' '' \
  '  快捷键帮助' 'h' 'run-shell @XRK_MENU@ help' \
  '  重载配置' 'r' 'source-file ~/.tmux.conf \; display "配置已重载"' \
  '  分离会话' 'd' 'detach-client'

# 网页终端备用（无右键时）
bind \\ run-shell '@XRK_MENU@ pane'
bind -n F9 run-shell '@XRK_MENU@ pane'
bind -n MouseDown2Pane run-shell '@XRK_MENU@ pane'
